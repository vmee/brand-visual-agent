name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.2.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Verify generated schema types
        run: |
          pnpm schema:types
          git diff --exit-code -- packages/schemas/src/generated
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/scan-secrets.mjs
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level high
      - name: Validate Agent Skill specification
        run: |
          python -m pip install skills-ref
          agentskills validate skills/brand-visual-designer
